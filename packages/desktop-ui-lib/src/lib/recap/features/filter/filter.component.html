<button nbButton [nbPopover]="irtranscriptsFilter" size="small" nbPopoverTrigger="click" status="basic">
	<nb-icon icon="more-horizontal-outline"></nb-icon>
</button>

<ng-template #irtranscriptsFilter>
	<ngx-irtranscripts-filters class="vertical" [filters]="filters$ | async" [hasTimeZoneFilter]="false" [saveFilters]="false"
		(filtersChange)="filtersChange($event)"></ngx-irtranscripts-filters>
	<ngx-auto-refresh></ngx-auto-refresh>
</ng-template>
