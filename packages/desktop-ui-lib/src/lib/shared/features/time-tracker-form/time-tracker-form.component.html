<div class="selector-container">
  <!-- Edit clickable icon -->
  @if (isShowEdit$ | async) {
    <nb-icon class="edit" (click)="onChange($event)" icon="edit-2-outline"></nb-icon>
  }
  <!-- Client selector -->
  <irtranscripts-client-selector class="selector"></irtranscripts-client-selector>

  <!-- Project selector -->
  <irtranscripts-project-selector class="selector"></irtranscripts-project-selector>

  <!-- Team selector -->
  @if (isShowTeamSelector$ | async) {
    <irtranscripts-team-selector class="selector"></irtranscripts-team-selector>
  }

  <!-- Task selector -->
  @if (isShowTaskSelector$ | async) {
    <irtranscripts-task-selector class="selector"></irtranscripts-task-selector>
  }

  <!-- Note -->
  <irtranscripts-note class="selector"></irtranscripts-note>
</div>
