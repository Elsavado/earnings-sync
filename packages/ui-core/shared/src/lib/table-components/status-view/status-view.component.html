@if (rowData?.taskStatus) {
  <irtranscripts-task-badge-view [taskBadge]="$safeNavigationMigration(rowData?.taskStatus)"></irtranscripts-task-badge-view>
} @else {
  <nb-badge
    [status]="status"
    [text]="value | replace : '_' : ' ' | titlecase"
    class="badge"
    position="centered"
  ></nb-badge>
}
