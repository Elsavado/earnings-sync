name: Little Games Incorporated records

# Builds the fictional company's records (excel/lgi): CRM, Accounting, Customer Support, Project Management,
# Data Warehouse and Email Exports, 2015 to date, and uploads them to the Shared Drive "Gaming Operations Data" under
# "Little Games Incorporated". Re-running refreshes the files in place (history stays the same; new days are added).
on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Size (1.0 = about 14.7 million player accounts)'
        required: false
        default: '1.0'
      dry_run:
        description: 'Build without uploading'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: lgi-records
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Build and upload the records
        env:
          SHARED_DRIVE_ID: ${{ vars.GAMING_DRIVE_ID || '0APJqW8wSgUmkUk9PVA' }}
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          LGI_SCALE: ${{ github.event.inputs.scale || '1.0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m lgi.main
