name: Earnings sync

on:
  schedule:
    # Every hour at :07 (cron is UTC; hourly runs land at hh:07 in Nairobi too).
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Only these tickers, comma separated (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'List what would be downloaded without uploading'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        # Companies are split across shards by a hash of the ticker. Four shards at
        # 450 ms between SEC requests stay under the SEC's 10 requests per second.
        shard: [0, 1, 2, 3]
    concurrency:
      group: earnings-sync-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: anonymizer/requirements.txt

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install -r anonymizer/requirements.txt

      - name: Install LibreOffice (converts legacy .xls/.doc/.ppt before anonymising)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc-nogui libreoffice-writer-nogui libreoffice-impress-nogui > /dev/null

      - name: Install Chromium when a page needs rendering
        run: |
          if node src/needs-browser.js; then
            npx playwright install --with-deps chromium
          fi

      - name: Run sync
        run: node src/index.js
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 4
          SEC_MIN_INTERVAL_MS: 450
          TICKERS: ${{ github.event.inputs.tickers }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ANON_KEY: ${{ secrets.ANON_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
