name: hassan spreadsheets and presentations (shintiru)

# Spreadsheets (up to N_SHEETS total with the 13,270 already on shintiru) and construction presentations (5+ slides each)
# uploaded to shintiru My Drive folder "hassan". Real data: the Slovak treasury 2025 register (anonymised).
on:
  push:
    branches: [shintiru-office]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spreadsheets:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Build spreadsheets
        env:
          OUT: out
          N_SHEETS: '16730'
        run: python office/build_office.py spreadsheets | tee sheets.log
      - name: Install rclone and write config
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
      - name: Upload spreadsheets
        run: rclone copy out/Spreadsheets "shintiru:hassan/Spreadsheets" --transfers 8 --checkers 16 --tpslimit 8 --stats 120s
      - name: Summary
        run: |
          echo '## hassan spreadsheets' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; cat sheets.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

  presentations:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx
      - name: Build presentations
        env:
          OUT: out
          N_DECKS: '5000'
          REAL_SHARE_DECKS: '0.15'
        run: python office/build_office.py presentations | tee decks.log
      - name: Install rclone and write config
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
      - name: Upload presentations
        run: rclone copy out/Presentations "shintiru:hassan/Presentations" --transfers 8 --checkers 16 --tpslimit 8 --stats 120s
      - name: Summary
        run: |
          echo '## hassan presentations' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; cat decks.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
