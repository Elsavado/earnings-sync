name: Financelitics data

# Workspace shared drive "Research Collections" (joseph@irtranscripts.com), folder "Financelitics": data for a financial
# analytics firm (earnings call analysis, 10-K/10-Q review, SEC comment letters, risk modelling, portfolio benchmarks,
# sector teams). Uploads only when repo variable FINLITICS_LIVE is "true". Public repository: logs print counts only.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "filings,comments,fred,fdic,famafrench,treasury,transcripts,books"
        default: "filings,comments,fred,fdic,famafrench,treasury,transcripts,books"
      minutes:
        description: "time budget (minutes)"
        default: "320"
      dry_run:
        description: "force a dry run (no upload)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

env:
  FINLITICS_DRIVE_ID: ${{ vars.RESEARCH_DRIVE_ID || '0ACsHljU9Hj2_Uk9PVA' }}
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency: finlitics-${{ matrix.name }}
    # phase 1 = core (real names). Phase 2 (2026-11-04, all anonymised) runs when FINLITICS2_LIVE is 'true' (else a
    # dry run): IPOs, deal data rooms, credit files (two lanes each: even / odd years), portfolio reporting, fund
    # holdings, ESG, wealth-management client records.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: core, sources: "", lane: "", phase: 1}
          - {name: ipos_a, sources: ipos, lane: even, phase: 2}
          - {name: ipos_b, sources: ipos, lane: odd, phase: 2}
          - {name: deals_a, sources: deals, lane: even, phase: 2}
          - {name: deals_b, sources: deals, lane: odd, phase: 2}
          - {name: credit_a, sources: credit, lane: even, phase: 2}
          - {name: credit_b, sources: credit, lane: odd, phase: 2}
          - {name: portfolio, sources: portfolio, lane: "", phase: 2}
          - {name: funds, sources: funds, lane: "", phase: 2}
          - {name: esg, sources: esg, lane: "", phase: 2}
          - {name: wealth, sources: wealth, lane: "", phase: 2}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt python-docx pillow && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libreoffice-writer > /dev/null
      - name: rclone for the Workspace shared drive
        env:
          CID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          CSECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone state
          python3 - <<'EOF'
          import json, os
          tok = json.dumps({"access_token": "expired", "token_type": "Bearer", "refresh_token": os.environ["RTOKEN"],
                            "expiry": "2000-01-01T00:00:00Z"})
          conf = (f"[ws]\ntype = drive\nscope = drive\nclient_id = {os.environ['CID']}\n"
                  f"client_secret = {os.environ['CSECRET']}\ntoken = {tok}\nteam_drive = {os.environ['FINLITICS_DRIVE_ID']}\n")
          p = os.path.expanduser("~/.config/rclone/rclone.conf")
          open(p, "w").write(conf)
          os.chmod(p, 0o600)
          print("sign-in values present:", {k: len(os.environ.get(k, "")) > 0 for k in ("CID", "CSECRET", "RTOKEN")})
          EOF
          rclone about ws: 2>&1 | grep -v -i token | head -5 || true
          rclone copy "ws:Financelitics/_state" state -q || true
      - name: Collect
        timeout-minutes: 335
        env:
          LIVE: ${{ (matrix.phase == 1 && vars.FINLITICS_LIVE == 'true' || matrix.phase == 2 && vars.FINLITICS2_LIVE == 'true') && inputs.dry_run != true }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          HOWCO_KEY: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          FL_LANE: ${{ matrix.lane }}
        run: |
          flag=$([ "$LIVE" = "true" ] && echo --live || echo "")
          if [ "${{ matrix.name }}" = core ]; then
            src="${{ inputs.sources || 'filings,comments,fred,fdic,famafrench,treasury,transcripts,books' }}"; state=state/finlitics.json
          else
            src="${{ matrix.sources }}"; state="state/finlitics-${{ matrix.name }}.json"
          fi
          python -m finlitics --sources "$src" --remote "ws:Financelitics" --state "$state" --minutes "${{ inputs.minutes || 320 }}" $flag

  next:
    # Endless hand-off: start the next run when this one ends (the watchdog's schedule is unreliable).
    needs: collect
    if: always() && vars.FINLITICS_LIVE == 'true' && vars.CHAIN != 'off' && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run financelitics.yml -R ${{ github.repository }} --ref main && exit 0
            sleep $(( i * 30 ))
          done
          echo "could not start the next run" >> "$GITHUB_STEP_SUMMARY"; exit 1
