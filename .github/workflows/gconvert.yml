name: Google copies of Office files

# Word -> Google Docs, Excel -> Google Sheets, PowerPoint -> Google Slides for the existing files on shintiru's drive,
# the Financelitics folder of Research Collections, and hassan's drive (its copies go to shintiru's drive: hassan's
# is full). Originals are kept (user, 2026-11-12). excel/gconvert.py; resumes by appProperties gcFrom.
# Each target starts its next run while files are left and the repository variable CONVERT_LIVE is 'true'.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'shintiru,financelitics,hassan'
        required: false
        default: 'shintiru,financelitics,hassan'
      dry_run:
        description: 'Count only'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'Run budget in minutes'
        required: false
        default: '320'

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.t.outputs.targets }}
    steps:
      - id: t
        env:
          T: ${{ github.event.inputs.targets || 'shintiru,financelitics,hassan' }}
        run: |
          python3 -c "import json,os; t=[x.strip() for x in os.environ['T'].split(',') if x.strip() in ('shintiru','financelitics','hassan')]; open(os.environ['GITHUB_OUTPUT'],'a').write('targets='+json.dumps(t)+chr(10))"

  convert:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    concurrency:
      group: gconvert-${{ matrix.target }}-${{ github.event.inputs.dry_run || 'false' }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-api-python-client google-auth
      - name: rclone remotes
        if: matrix.target != 'financelitics'
        env:
          SHIN: ${{ secrets.SHINTIRU_RCLONE_CONF }}
          HASSAN: ${{ secrets.HASSAN_RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          { printf '%s\n' "$SHIN"; printf '\n%s\n' "$HASSAN"; } > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ "${{ matrix.target }}" = hassan ] && ! rclone listremotes | grep -q '^hassan:'; then
            echo "secret HASSAN_RCLONE_CONF (the [hassan] section of rclone.conf) is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Convert
        id: run
        env:
          TARGET: ${{ matrix.target }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '320' }}
          WS_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          WS_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          WS_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
        run: python gconvert.py
      - name: Next run
        if: steps.run.outputs.left != '' && steps.run.outputs.left != '0' && github.event.inputs.dry_run != 'true' && vars.CONVERT_LIVE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gconvert.yml -R ${{ github.repository }} --ref main -f targets=${{ matrix.target }} -f dry_run=false
