name: Sheets, Docs, Slides and bookkeeping

# Collects openly licensed spreadsheets, documents, slide decks, PDF presentations and bookkeeping records
# (Zenodo, government open-data portals), anonymises them (people → Salvador Sekwa) and uploads them to the
# Workspace Shared Drive "Research Collections": XLSX/DOCX/PPTX become Google Sheets/Docs/Slides.
# Layout: "<Type>/Folder N (Documents a-b)/<n> - <label>" (fdocs/office.py). One job per type.
# Runs chain back-to-back while the repository variable OFFICE_LIVE is 'true'.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Process without uploading'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'Run budget in minutes'
        required: false
        default: '50'
      kinds:
        description: 'Only these types (gsheets,gdocs,slides,presentations,bookkeeping)'
        required: false
        default: 'gsheets,gdocs,slides,presentations,bookkeeping'
      chained:
        description: 'Started by the previous run (internal)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: office-collect-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

env:
  SHARED_DRIVE_ID: ${{ vars.OFFICE_DRIVE_ID || '0ACsHljU9Hj2_Uk9PVA' }}
  FD_ROOT: ''
  FD_PRIVATE: 'Office Collector - private'
  FD_APP: 'irt-office'
  COLLECTOR_TITLE: 'Sheets, Docs, Slides and bookkeeping'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.check.outputs.go }}
      kinds: ${{ steps.check.outputs.kinds }}
    steps:
      - id: check
        env:
          LIVE: ${{ vars.OFFICE_LIVE }}
          CHAINED: ${{ github.event.inputs.chained || 'false' }}
          KINDS: ${{ github.event.inputs.kinds || 'gsheets,gdocs,slides,presentations,bookkeeping' }}
        run: |
          python3 - <<'PY'
          import json, os
          go = not (os.environ['CHAINED'] == 'true' and os.environ['LIVE'] != 'true')
          ok = ('gsheets', 'gdocs', 'slides', 'presentations', 'bookkeeping')
          kinds = [k.strip() for k in os.environ['KINDS'].split(',') if k.strip() in ok]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"go={'true' if go and kinds else 'false'}\nkinds={json.dumps(kinds)}\n")
          print('go' if go else 'stop', kinds)
          PY

  collect:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.prepare.outputs.kinds) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        if: matrix.kind == 'gdocs' || matrix.kind == 'slides'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress > /dev/null
          soffice --version
      - name: Install Python packages
        run: pip install -q -r requirements.txt
      - name: Collect, anonymise and upload
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
          KINDS: ${{ matrix.kind }}
          WORKERS: '3'
        run: python -m fdocs.main
      - name: Keep dry-run samples
        if: always() && github.event.inputs.dry_run == 'true' && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: office-samples-${{ matrix.kind }}-${{ github.run_id }}
          path: excel/samples
          retention-days: 7

  next:
    needs: [prepare, collect]
    if: always() && needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true' && vars.OFFICE_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run office-collect.yml -R ${{ github.repository }} --ref main -f dry_run=false -f minutes=50 -f chained=true
