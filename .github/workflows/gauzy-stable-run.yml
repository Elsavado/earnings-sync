name: Gauzy stable run (demo)

on:
  push:
    branches: [gauzy-stable-run]
  workflow_dispatch:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn 1.22
        run: npm i -g yarn@1.22

      - name: Bootstrap (README "yarn bootstrap")
        run: yarn bootstrap:ci
        env:
          NX_DAEMON: "false"

      - name: Build workspace packages into dist/packages (the API copy step needs them)
        run: node node_modules/nx/dist/bin/nx.js run-many -t build -p api gauzy --parallel=2
        env:
          NX_DAEMON: "false"
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Start API and UI (README "yarn start")
        run: |
          nohup yarn start > /tmp/start.log 2>&1 &

      - name: Wait for API and UI
        run: |
          for i in $(seq 1 120); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/ || true)
            ui=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/ || true)
            echo "attempt $i api=$api ui=$ui"
            if [ "$api" != "000" ] && [ "$ui" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::API or UI did not come up"; tail -n 200 /tmp/start.log; exit 1

      - name: Smoke test with README demo logins
        run: |
          for creds in "admin@ever.co admin" "employee@ever.co 12345678"; do
            set -- $creds
            code=$(curl -s -o /tmp/login.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"email\":\"$1\",\"password\":\"$2\"}" http://localhost:3000/api/auth/login)
            echo "login $1 -> HTTP $code"
            head -c 300 /tmp/login.json; echo
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-log
          path: /tmp/start.log
          if-no-files-found: ignore
