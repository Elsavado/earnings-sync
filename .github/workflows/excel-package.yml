name: Excel models package

# Manual: downloads one numbered Drive folder of models and returns it as a zip artifact.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder number (1 = Models 1-20)'
        required: true
        default: '1'
      complete:
        description: 'Fail unless the folder already holds all 20 models'
        type: boolean
        required: false
        default: false
      repair:
        description: 'Also remove tabs left empty and update the files in Drive'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-api-python-client google-auth openpyxl
      - run: python -m models.package ${{ github.event.inputs.folder }} out ${{ github.event.inputs.repair == 'true' && '--repair' || '' }} ${{ github.event.inputs.complete == 'true' && '--complete' || '' }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: excel-folder-${{ github.event.inputs.folder }}
          path: excel/out
          retention-days: 30
