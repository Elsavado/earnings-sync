name: Shintiru Slides, Docs and Sheets

# The shintiru library's office collector (user, 2026-11-12): PowerPoint, Word and Excel files found through the
# Common Crawl index (fdocs/ccweb.py) about finance, learning or operations, mostly English, anonymised (people ->
# Redacted Name) and uploaded to shintiru's My Drive as Google Slides / Docs / Sheets under
# "Library/11 Google Slides, Docs & Sheets/<Type>/Folder N (Documents a-b)/<n> - <label>". Same code as the Workspace
# office collector (office-collect.yml) with OFFICE_PROFILE=shintiru; Common Crawl is used by this profile only.
# Runs chain back-to-back while the repository variable SHINTIRU_OFFICE_LIVE is 'true'.
# Full force (user, 2026-11-12): parallel scanner jobs (var SHINTIRU_SCANNERS, default 10) each read one Common Crawl
# index on their own runner (fdocs/ccscan.py; Common Crawl throttles many threads from one address) and leave lists
# of found files in the private folder's cc-inbox; one collector job per type queues them, downloads, anonymises and
# uploads.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Process without uploading'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'Run budget in minutes'
        required: false
        default: '50'
      kinds:
        description: 'Only these types (gsheets,gdocs,slides)'
        required: false
        default: 'gsheets,gdocs,slides'
      chained:
        description: 'Started by the previous run (internal)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: shintiru-office-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

env:
  SHARED_DRIVE_ID: ''
  FD_ROOT: 'Library/11 Google Slides, Docs & Sheets'
  FD_PRIVATE: 'Library Office Collector - private'
  FD_APP: 'shintiru-office'
  OFFICE_PROFILE: 'shintiru'
  SHINTIRU_ANONYMISE: ${{ vars.SHINTIRU_ANONYMISE || 'false' }}   # user, 2026-11-13: anonymising not a must
  COLLECTOR_TITLE: 'Shintiru Slides, Docs and Sheets'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.check.outputs.go }}
      kinds: ${{ steps.check.outputs.kinds }}
      shards: ${{ steps.check.outputs.shards }}
    steps:
      - id: check
        env:
          LIVE: ${{ vars.SHINTIRU_OFFICE_LIVE }}
          CHAINED: ${{ github.event.inputs.chained || 'false' }}
          KINDS: ${{ github.event.inputs.kinds || 'gsheets,gdocs,slides' }}
          SCANNERS: ${{ vars.SHINTIRU_SCANNERS }}
        run: |
          python3 - <<'PY'
          import json, os
          go = not (os.environ['CHAINED'] == 'true' and os.environ['LIVE'] != 'true')
          ok = ('gsheets', 'gdocs', 'slides')
          kinds = [k.strip() for k in os.environ['KINDS'].split(',') if k.strip() in ok]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"go={'true' if go and kinds else 'false'}\nkinds={json.dumps(kinds)}\n")  # one collector job per type
              f.write(f"shards={json.dumps(list(range(int(os.environ.get('SCANNERS') or 10))))}\n")
          print('go' if go else 'stop', kinds)
          PY

  scan:
    needs: prepare
    if: needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt duckdb
      - name: Drive sign-in (rclone remote shintiru)
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copy -q "shintiru:$FD_PRIVATE/cc-scan" /tmp/cursors || true
          touch /tmp/stamp
      - name: Read the index
        env:
          RUN_MINUTES: '48'
        run: python -m fdocs.ccscan ${{ matrix.shard }} /tmp/cursors /tmp/found
      - name: Hand the lists to the collectors
        if: always()
        run: |
          # only this job's crawl cursor (the others belong to other scanners), then the found lists per type
          find /tmp/cursors -newer /tmp/stamp -name '*.json' | while read -r f; do rclone copy -q "$f" "shintiru:$FD_PRIVATE/cc-scan"; done
          if [ -d /tmp/found ]; then rclone copy -q /tmp/found "shintiru:$FD_PRIVATE/cc-inbox"; fi

  explore:
    # sites that already gave good files: their own pages and sitemaps, and their Wayback Machine copies since 2012
    needs: prepare
    if: needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Drive sign-in (rclone remote shintiru)
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copy -q "shintiru:$FD_PRIVATE" /tmp/states --include 'state*.json.gz' --max-depth 1
          rclone copy -q "shintiru:$FD_PRIVATE/sites" /tmp/cursors --include "sites-${{ matrix.shard }}.json" || true
      - name: Explore sites and the Wayback Machine
        env:
          RUN_MINUTES: '48'
        run: python -m fdocs.sites ${{ matrix.shard }} 4 /tmp/states /tmp/cursors /tmp/found
      - name: Hand the lists to the collectors
        if: always()
        run: |
          if [ -f /tmp/cursors/sites-${{ matrix.shard }}.json ]; then rclone copy -q /tmp/cursors/sites-${{ matrix.shard }}.json "shintiru:$FD_PRIVATE/sites"; fi
          if [ -d /tmp/found ]; then rclone copy -q /tmp/found "shintiru:$FD_PRIVATE/cc-inbox"; fi

  search:
    # Brave Search API: topic phrases x file types, capped by var BRAVE_MONTHLY_CAP; off without the secret
    needs: prepare
    if: needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Drive sign-in (rclone remote shintiru)
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone copy -q "shintiru:$FD_PRIVATE/search" /tmp/cursors || true
      - name: Search
        env:
          RUN_MINUTES: '45'
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BRAVE_MONTHLY_CAP: ${{ vars.BRAVE_MONTHLY_CAP }}
        run: python -m fdocs.brave /tmp/cursors /tmp/found
      - name: Hand the lists to the collectors
        if: always()
        run: |
          if [ -f /tmp/cursors/brave.json ]; then rclone copy -q /tmp/cursors/brave.json "shintiru:$FD_PRIVATE/search"; fi
          if [ -d /tmp/found ]; then rclone copy -q /tmp/found "shintiru:$FD_PRIVATE/cc-inbox"; fi

  collect:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.prepare.outputs.kinds) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress > /dev/null
          soffice --version
      - name: Install Python packages
        run: pip install -q -r requirements.txt 'anthropic>=1.13,<3' 'kaggle==2.2.5' six
      - name: Drive sign-in (rclone remote shintiru)
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone about shintiru: 2>&1 | grep -E "^(Total|Used|Free)" || true
      - name: Collect, anonymise and upload
        env:
          RCLONE_REMOTE: shintiru
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
          KINDS: ${{ matrix.kind }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ vars.KAGGLE_USERNAME }}
          WORKERS: '4'
          DRIVE_FLOOR_GB: '50'
        run: |
          # Large workbooks skipped by earlier runs go to a private Kaggle notebook (30 GB); finished ones come back
          # and are uploaded here first (fdocs/bigbook.py). Never stops the run.
          [ -n "$KAGGLE_USERNAME" ] && echo "::add-mask::$KAGGLE_USERNAME"
          if true; then python -m fdocs.bigbook sync || true; fi
          rclone move -q "shintiru:$FD_PRIVATE/cc-inbox/$KINDS" /tmp/inbox || true
          echo "lists from the scanners: $(ls /tmp/inbox 2>/dev/null | wc -l)"
          CC_INBOX=/tmp/inbox STATE_SEED=1 python -m fdocs.main
      - name: Return unread scanner lists
        if: always() && github.event.inputs.dry_run != 'true'
        run: if [ -d /tmp/inbox ] && [ -n "$(ls /tmp/inbox)" ]; then rclone move -q /tmp/inbox "shintiru:$FD_PRIVATE/cc-inbox/${{ matrix.kind }}"; fi
      - name: Keep dry-run samples
        if: always() && github.event.inputs.dry_run == 'true' && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: shintiru-office-samples-${{ matrix.kind }}-${{ github.run_id }}
          path: excel/samples
          retention-days: 7

  next:
    needs: [prepare, scan, explore, search, collect]
    if: always() && needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true' && vars.SHINTIRU_OFFICE_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run chain-watchdog.yml -R ${{ github.repository }} --ref main || true   # wake the watchdog (its cron is throttled)
          for i in 1 2 3 4 5 6; do
            gh workflow run shintiru-office.yml -R ${{ github.repository }} --ref main -f dry_run=false -f minutes=50 -f chained=true && exit 0
            sleep $(( i * 30 ))
          done
          echo "could not start the next run" >> "$GITHUB_STEP_SUMMARY"; exit 1
