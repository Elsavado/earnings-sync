name: Security lab - run attacks and log

# Free lab on GitHub's Windows machine (user, 2026-11-13: "free options only"). Full logging enabled (Sysmon,
# Windows Security, PowerShell), then attack techniques from Atomic Red Team run on this machine only. Logs exported
# and saved to Shintiru. The machine is thrown away after. Nothing reaches any other computer.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Technique group (0-6, run one per session)'
        required: false
        default: '0'
      minutes:
        description: 'Run time budget in minutes'
        required: false
        default: '180'

permissions:
  contents: read

concurrency:
  group: security-lab
  cancel-in-progress: false

env:
  DEST: 'Library/13 Security Logs & Telemetry/Own Lab'

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile "$env:RUNNER_TEMP\rclone.zip"
          Expand-Archive "$env:RUNNER_TEMP\rclone.zip" "$env:RUNNER_TEMP\rc" -Force
          $dir = (Get-ChildItem "$env:RUNNER_TEMP\rc" -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_PATH $dir
          & "$dir\rclone.exe" version
        shell: pwsh

      - name: Drive sign-in (rclone remote shintiru)
        env:
          CONF: ${{ secrets.SHINTIRU_RCLONE_CONF }}
        run: |
          mkdir "$env:USERPROFILE\.config\rclone" -Force | Out-Null
          "$env:CONF" | Out-File "$env:USERPROFILE\.config\rclone\rclone.conf" -Encoding ASCII
          (Get-Item "$env:USERPROFILE\.config\rclone\rclone.conf").Attributes = 'Hidden'
          rclone listremotes
        shell: pwsh

      - name: Enable full logging
        run: |
          # Audit policy
          auditpol /set /category:* /success:enable /failure:enable | Out-Null
          # Process command lines
          reg add 'HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\System\Audit' /v ProcessCreationIncludeCmdLine_Enabled /t REG_DWORD /d 1 /f | Out-Null
          # PowerShell logging
          reg add 'HKLM\Software\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging' /v EnableScriptBlockLogging /t REG_DWORD /d 1 /f | Out-Null
          reg add 'HKLM\Software\Policies\Microsoft\Windows\PowerShell\ModuleLogging' /v EnableModuleLogging /t REG_DWORD /d 1 /f | Out-Null
          reg add 'HKLM\Software\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames' /v '*' /t REG_SZ /d '*' /f | Out-Null
          # Event log sizes
          foreach ($log in 'Security', 'System', 'Application', 'Microsoft-Windows-PowerShell/Operational') {
            wevtutil sl "$log" /ms:2147483648 2>$null
          }
          Write-Host 'Logging enabled'
        shell: pwsh

      - name: Install Sysmon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Path $tools -Force | Out-Null
          Invoke-WebRequest https://live.sysinternals.com/Sysmon64.exe -OutFile "$tools\Sysmon64.exe"
          $rel = Invoke-RestMethod https://api.github.com/repos/olafhartong/sysmon-modular/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $cfg = ($rel.assets | Where-Object name -eq 'sysmonconfig.xml').browser_download_url
          Invoke-WebRequest $cfg -OutFile "$tools\sysmonconfig.xml"
          & "$tools\Sysmon64.exe" -accepteula -i "$tools\sysmonconfig.xml" | Out-Null
          wevtutil sl 'Microsoft-Windows-Sysmon/Operational' /ms:2147483648 2>$null
          Write-Host 'Sysmon installed'
        shell: pwsh

      - name: Install Atomic Red Team
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name powershell-yaml -Force -Scope CurrentUser -Repository PSGallery
          $art = "$env:RUNNER_TEMP\AtomicRedTeam"
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          Invoke-WebRequest https://github.com/redcanaryco/invoke-atomicredteam/archive/refs/heads/master.zip -OutFile "$env:RUNNER_TEMP\iar.zip" -UseBasicParsing
          Invoke-WebRequest https://github.com/redcanaryco/atomic-red-team/archive/refs/heads/master.zip -OutFile "$env:RUNNER_TEMP\art.zip" -UseBasicParsing
          Expand-Archive "$env:RUNNER_TEMP\iar.zip" "$env:RUNNER_TEMP\x" -Force
          Expand-Archive "$env:RUNNER_TEMP\art.zip" "$env:RUNNER_TEMP\x" -Force
          Move-Item "$env:RUNNER_TEMP\x\invoke-atomicredteam-master" "$art\invoke-atomicredteam" -Force
          Move-Item "$env:RUNNER_TEMP\x\atomic-red-team-master\atomics" "$art\atomics" -Force
          Write-Host "Atomic tests: $((Get-ChildItem "$art\atomics" -Directory).Count) techniques"
        shell: pwsh

      - name: Run attack techniques
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $out = "$env:RUNNER_TEMP\lab"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $groups = @(
            @('T1003.001','T1003.002','T1059.001','T1059.003','T1082','T1016','T1057'),
            @('T1069.001','T1112','T1136.001','T1548.002','T1033','T1049','T1083'),
            @('T1518.001','T1555.003','T1552.001','T1027','T1105','T1140','T1218.010'),
            @('T1003.003','T1047','T1053.002','T1098','T1124','T1135'),
            @('T1543.003','T1547.001','T1053.005','T1197'),
            @('T1007','T1018','T1087.001','T1036.003'),
            @('T1059.005','T1218.011','T1055')
          )

          $group = [int]'${{ github.event.inputs.group || 0 }}' % 7
          $techniques = $groups[$group]
          $end = (Get-Date).AddMinutes([int]'${{ github.event.inputs.minutes || 180 }}')

          $atomics = "$env:RUNNER_TEMP\AtomicRedTeam\atomics"
          Import-Module "$env:RUNNER_TEMP\AtomicRedTeam\invoke-atomicredteam\Invoke-AtomicRedTeam.psd1" -Force

          $timeline = @()
          Write-Host "Running $($techniques.Count) techniques, group $group"

          foreach ($t in $techniques) {
            if ((Get-Date) -gt $end) { Write-Host 'Time budget reached'; break }
            $yaml = "$atomics\$t\$t.yaml"
            if (-not (Test-Path $yaml)) { Write-Host "$t not found"; continue }
            $tests = (Get-AtomicTechnique -Path $yaml).atomic_tests
            for ($i = 0; $i -lt $tests.Count; $i++) {
              $test = $tests[$i]
              if ($test.supported_platforms -notcontains 'windows') { continue }
              if ($test.executor.name -eq 'manual') { continue }
              $n = $i + 1
              Write-Host "  ${t} / ${n}: $($test.name)"
              try {
                Invoke-AtomicTest $t -TestNumbers $n -GetPrereqs -PathToAtomicsFolder $atomics -TimeoutSeconds 120 *>$null
                Invoke-AtomicTest $t -TestNumbers $n -PathToAtomicsFolder $atomics -TimeoutSeconds 120 *>$null
                $timeline += "$t/$n ran"
              } catch {
                $timeline += "$t/$n error: $_"
              }
            }
          }

          $timeline | Out-File "$out\timeline.txt"
          Write-Host "Ran $(($timeline | ? { $_ -match 'ran' }).Count) tests"
        shell: pwsh

      - name: Export logs
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\lab"
          New-Item -ItemType Directory -Path "$out\evtx" -Force | Out-Null
          foreach ($log in 'Security', 'System', 'Application', 'Microsoft-Windows-Sysmon/Operational', 'Microsoft-Windows-PowerShell/Operational') {
            $file = "$out\evtx\$($log -replace '/', '_').evtx"
            wevtutil epl "$log" "$file" /overwrite:true 2>$null
          }
          Write-Host "Logs exported: $(Get-ChildItem $out\evtx | Measure-Object -Property Length -Sum | % { [math]::Round($_.Sum/1GB, 2) }) GB"
        shell: pwsh

      - name: Upload to Shintiru
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\lab"
          $stage = "$env:RUNNER_TEMP\stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $prefix = "g${{ github.event.inputs.group || 0 }}_$(Get-Date -f 'yyyyMMdd-HHmmss')"
          # Flatten: one folder, no subfolders, every file name prefixed uniquely
          Get-ChildItem -Path $out -Recurse -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $stage "${prefix}_$($_.Name)") }
          $d = "shintiru:IRT Corp Events Logs"
          rclone mkdir "$d"
          rclone copy -q "$stage" "$d"
          rclone size "$d" | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY "- Lab logs: $_" }
        shell: pwsh
