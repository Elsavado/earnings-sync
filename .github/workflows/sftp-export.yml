name: SFTP export

# Copies a folder of the IR Transcripts Shared Drive to the IR Transcripts SFTP server
# (AWS Transfer). One job per subfolder, so each type uploads on its own runner.
# Only files missing on the server (or with a different size) are sent.
on:
  workflow_dispatch:
    inputs:
      folder:
        description: Drive folder to export (top level of the IR Transcripts drive)
        default: Financial Documents
      drive_id:
        description: Shared Drive id (default IR Transcripts)
        default: 0AM6PzKRbJBK-Uk9PVA
      dest:
        description: Server folder to copy into (default = same name as the Drive folder)
        default: ''
      include:
        description: Only files whose name matches this rclone pattern (optional)
        default: ''
      dry_run:
        description: List what would be copied, send nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRIVE_ID: ${{ inputs.drive_id }}
  DEST: ${{ inputs.dest || inputs.folder }}
  INCLUDE: ${{ inputs.include }}
  SFTP_HOST: s-a44b57dae4364306a.server.transfer.us-east-1.amazonaws.com
  SFTP_USER: ir-transcripts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
      - name: Configure remotes
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
        run: |
          RT=$(printf '%s' "$GOOGLE_REFRESH_TOKEN" | tr -d '\r\n ')
          resp=$(curl -s https://oauth2.googleapis.com/token -d client_id="$GOOGLE_CLIENT_ID" -d client_secret="$GOOGLE_CLIENT_SECRET" -d refresh_token="$RT" -d grant_type=refresh_token)
          AT=$(jq -r '.access_token // empty' <<<"$resp")
          [ -n "$AT" ] || { echo "Google token refresh failed: $(jq -c '{error,error_description}' <<<"$resp")"; exit 1; }
          EXP=$(date -u -d '+50 min' +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p ~/.config/rclone
          cat >> ~/.config/rclone/rclone.conf <<CONF
          [ws]
          type = drive
          client_id = $GOOGLE_CLIENT_ID
          client_secret = $GOOGLE_CLIENT_SECRET
          scope = drive.readonly
          team_drive = $DRIVE_ID
          token = {"access_token":"$AT","refresh_token":"$RT","token_type":"Bearer","expiry":"$EXP"}
          CONF
          sed -i 's/^ *//' ~/.config/rclone/rclone.conf
      - id: parts
        run: |
          parts=$(rclone lsf "ws:${{ inputs.folder }}" --dirs-only | sed 's#/$##' | jq -R . | jq -cs .)
          # a folder holding only files is copied as one part ("." = the folder itself)
          [ "$parts" != "[]" ] || parts='["."]'
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "$parts"

  copy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
      - name: Configure remotes
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
        run: |
          RT=$(printf '%s' "$GOOGLE_REFRESH_TOKEN" | tr -d '\r\n ')
          resp=$(curl -s https://oauth2.googleapis.com/token -d client_id="$GOOGLE_CLIENT_ID" -d client_secret="$GOOGLE_CLIENT_SECRET" -d refresh_token="$RT" -d grant_type=refresh_token)
          AT=$(jq -r '.access_token // empty' <<<"$resp")
          [ -n "$AT" ] || { echo "Google token refresh failed: $(jq -c '{error,error_description}' <<<"$resp")"; exit 1; }
          EXP=$(date -u -d '+50 min' +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p ~/.config/rclone
          cat >> ~/.config/rclone/rclone.conf <<CONF
          [ws]
          type = drive
          client_id = $GOOGLE_CLIENT_ID
          client_secret = $GOOGLE_CLIENT_SECRET
          scope = drive.readonly
          team_drive = $DRIVE_ID
          token = {"access_token":"$AT","refresh_token":"$RT","token_type":"Bearer","expiry":"$EXP"}
          CONF
          sed -i 's/^ *//' ~/.config/rclone/rclone.conf
          install -m 600 /dev/null "$HOME/sftp_key" && printf '%s\n' "$SFTP_KEY" > "$HOME/sftp_key"
          rclone config create sftp sftp host="$SFTP_HOST" user="$SFTP_USER" key_file="$HOME/sftp_key" \
            shell_type=none md5sum_command=none sha1sum_command=none set_modtime=false disable_hashcheck=true \
            --non-interactive > /dev/null
      - name: Copy
        run: |
          src="ws:${{ inputs.folder }}/${{ matrix.part }}"
          dst="sftp:/$DEST/${{ matrix.part }}"
          filt=(); [ -n "$INCLUDE" ] && filt=(--include "$INCLUDE")
          rclone copy "$src" "$dst" "${filt[@]}" --size-only --transfers 16 --checkers 16 --fast-list \
            --retries 5 --low-level-retries 20 --max-duration 5h40m --cutoff-mode soft \
            --stats 2m --stats-one-line --log-level NOTICE --log-file copy.log ${{ inputs.dry_run && '--dry-run' || '' }}
          # file names stay out of the (public) log; only counts are shown
          echo "would copy / copied: $(grep -c 'Skipped copy as --dry-run\|Copied' copy.log || true) files"
          grep -E 'ERROR|Transferred:' copy.log | sed -E 's/: [^:]+\.[A-Za-z0-9]{2,5}: /: <file>: /' | tail -5 || true
      - name: Check
        if: ${{ !inputs.dry_run }}
        run: |
          filt=(); [ -n "$INCLUDE" ] && filt=(--include "$INCLUDE")
          rclone check "ws:${{ inputs.folder }}/${{ matrix.part }}" "sftp:/$DEST/${{ matrix.part }}" "${filt[@]}" \
            --size-only --one-way --fast-list --missing-on-dst missing.txt || true
          echo "### ${{ matrix.part }}: $(wc -l < missing.txt) still missing on the server" >> "$GITHUB_STEP_SUMMARY"
