name: Enhance models

# Rebuilds the generated models with model-specific logic (excel/models/variants.py) and verifies each one.
# mode=test builds a random sample and reports counts only; the replace mode is added once every family passes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test'
        required: false
        default: 'test'
      kind:
        description: 'Model families, comma list (three, integrated, valuation, buyout, budget, credit, strategic)'
        required: false
        default: 'three'
      size:
        description: 'Sample size for mode=test'
        required: false
        default: '40'
      seed:
        description: 'Sample seed'
        required: false
        default: '7'

permissions:
  contents: read

jobs:
  kinds:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.k.outputs.list }}
    steps:
      - id: k
        env:
          KIND: ${{ github.event.inputs.kind }}
        run: python3 -c "import json,os;print('list='+json.dumps([k.strip() for k in os.environ['KIND'].split(',') if k.strip()]))" >> "$GITHUB_OUTPUT"

  test:
    needs: kinds
    if: github.event.inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.kinds.outputs.list) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
          soffice --version
      - run: pip install -q -r requirements.txt
      - name: Build and verify a sample
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEED: ${{ github.event.inputs.seed }}
          SAMPLES: samples
        run: python -m models.enhanced test ${{ matrix.kind }} ${{ github.event.inputs.size }}
      - name: Keep three passing samples (1 day)
        if: always() && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-samples-${{ matrix.kind }}
          path: excel/samples
          retention-days: 1
