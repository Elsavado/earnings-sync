name: Enhance models

# Rebuilds the generated models with model-specific logic (excel/models/variants.py) and verifies each one.
# mode=test builds a random sample and reports counts only; the replace mode is added once every family passes.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test, plan, replace, audit, dedupe or redo'
        required: false
        default: 'test'
      kind:
        description: 'Model families, comma list (three, integrated, valuation, buyout, budget, credit, strategic)'
        required: false
        default: 'three'
      size:
        description: 'Sample size for mode=test'
        required: false
        default: '40'
      seed:
        description: 'Sample seed'
        required: false
        default: '7'
      collection:
        description: 'plan / replace: excel or enterprise'
        required: false
        default: 'excel'
      dry_run:
        description: 'replace: rebuild and verify only, no overwrite (10 minutes per shard)'
        type: boolean
        required: false
        default: false
      chained:
        description: 'Started by the previous replace run (internal)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

env:
  SHARDS: '20'

jobs:
  kinds:
    if: github.event.inputs.mode == 'test'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.k.outputs.list }}
    steps:
      - id: k
        env:
          KIND: ${{ github.event.inputs.kind }}
        run: python3 -c "import json,os;print('list='+json.dumps([k.strip() for k in os.environ['KIND'].split(',') if k.strip()]))" >> "$GITHUB_OUTPUT"

  test:
    needs: kinds
    if: github.event.inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.kinds.outputs.list) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
          soffice --version
      - run: pip install -q -r requirements.txt
      - name: Build and verify a sample
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SEED: ${{ github.event.inputs.seed }}
          SAMPLES: samples
        run: python -m models.enhanced test ${{ matrix.kind }} ${{ github.event.inputs.size }}
      - name: Keep three passing samples (1 day)
        if: always() && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-samples-${{ matrix.kind }}
          path: excel/samples
          retention-days: 1

  plan:
    if: github.event.inputs.mode == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: List the models to replace (plan saved on the drive)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ENT_NAME_KEY: ${{ secrets.ENT_NAME_KEY }}
          ENTERPRISE_DRIVE_ID: ${{ vars.ENTERPRISE_DRIVE_ID }}
        run: python -m models.replace plan ${{ github.event.inputs.collection }}

  shards:
    if: contains(fromJSON('["replace","audit","redo"]'), github.event.inputs.mode)
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        run: python3 -c "import json,os;print('list='+json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"

  replace:
    needs: shards
    if: github.event.inputs.mode == 'replace' || github.event.inputs.mode == 'redo'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-calc > /dev/null
      - run: pip install -q -r requirements.txt
      - name: Rebuild, verify and overwrite in place
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ENT_NAME_KEY: ${{ secrets.ENT_NAME_KEY }}
          ENTERPRISE_DRIVE_ID: ${{ vars.ENTERPRISE_DRIVE_ID }}
          RUN_MINUTES: ${{ github.event.inputs.dry_run == 'true' && '10' || '50' }}
          REPLACE_DRY: ${{ github.event.inputs.dry_run || 'false' }}
          REDO: ${{ github.event.inputs.mode == 'redo' }}
        run: python -m models.replace run ${{ github.event.inputs.collection }} ${{ matrix.shard }} $SHARDS

  chain:
    needs: replace
    if: always() && needs.replace.result != 'cancelled' && github.event.inputs.dry_run != 'true' && github.event.inputs.mode == 'replace'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - id: st
        name: Progress
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          ENTERPRISE_DRIVE_ID: ${{ vars.ENTERPRISE_DRIVE_ID }}
        run: python -m models.replace status ${{ github.event.inputs.collection }} $SHARDS
      - name: Start the next run
        if: steps.st.outputs.remaining != '0' && vars.ENHANCE_LIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run enhance-models.yml -R ${{ github.repository }} --ref main -f mode=replace -f collection=${{ github.event.inputs.collection }} -f chained=true

  audit:
    needs: shards
    if: github.event.inputs.mode == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Logic signature of every replaced model
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ENT_NAME_KEY: ${{ secrets.ENT_NAME_KEY }}
          ENTERPRISE_DRIVE_ID: ${{ vars.ENTERPRISE_DRIVE_ID }}
          RUN_MINUTES: '52'
        run: python -m models.replace audit ${{ github.event.inputs.collection }} ${{ matrix.shard }} $SHARDS

  dedupe:
    if: github.event.inputs.mode == 'dedupe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Register of logics; models sharing one go on the redo list
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          ENTERPRISE_DRIVE_ID: ${{ vars.ENTERPRISE_DRIVE_ID }}
        run: python -m models.replace dedupe ${{ github.event.inputs.collection }} $SHARDS

