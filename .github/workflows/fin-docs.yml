name: Financial documents

# Collects public financial documents (diligence reports and banker decks, research, investor
# letters, investment memos, term sheets/LOIs/NDAs, earnings call transcripts, contracts,
# notebooks, transaction and payroll data), anonymises them and uploads them to Google Drive as
# "Financial Documents/<Type>/Folder N (Documents a-b)/<n> - <label>.<ext>".
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Process without uploading'
        type: boolean
        required: false
        default: false
      reset:
        description: 'Delete all uploaded documents and restart numbering at 1 before running'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'Run budget in minutes'
        required: false
        default: '50'
      kinds:
        description: 'Only these types (comma list, e.g. transcripts,cim); empty = all'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: fin-docs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress > /dev/null
          soffice --version
      - name: Install Python packages
        run: pip install -q -r requirements.txt
      - name: Collect, anonymise and upload
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RESET: ${{ github.event.inputs.reset || 'false' }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
          KINDS: ${{ github.event.inputs.kinds || '' }}
        run: python -m fdocs.main
      - name: Start the next run
        # Runs chain back-to-back. Dry runs and a paused collector (FIN_DOCS_LIVE != true) stop the chain.
        if: always() && github.event.inputs.dry_run != 'true' && vars.FIN_DOCS_LIVE == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fin-docs.yml --ref main -f dry_run=false -f minutes=50
      - name: Keep dry-run samples
        if: always() && github.event.inputs.dry_run == 'true' && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fin-docs-samples-${{ github.run_id }}
          path: excel/samples
          retention-days: 7
