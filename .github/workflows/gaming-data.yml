name: Gaming operations data

# Public gaming operational data (excel/gaming) → Workspace Shared Drive "Gaming Operations Data", filed under
# 1 Players & Engagement … 7 Industry Benchmarks. Hourly: concurrent players. Daily (02 UTC): regional prices,
# App Store charts, yesterday's player summary. Weekly (Sunday 04 UTC) or kinds=full: catalogue, details, reviews,
# update timelines, hardware survey, company financials and KPIs, then benchmarks; plus game development material
# (8 Game Development: open-source game/engine code with history, design documents, gameplay + input datasets,
# CC gameplay videos, telemetry datasets, CC0 3D assets) and the Little Games Inc tool exports (kinds=dev runs only these).
# Scheduled runs only act while the repository variable GAMING_LIVE is 'true'.
on:
  schedule:
    - cron: '7 * * * *'
    - cron: '20 4 * * 0'
  workflow_dispatch:
    inputs:
      kinds:
        description: 'full, dev, or a comma list: catalog,details,reviews,news,prices,players,players_daily,mobile,hardware,companies,benchmarks,code,gdd,inputs,videos,telemetry,assets,lgi_dev'
        required: false
        default: 'full'
      dry_run:
        description: 'Small samples, nothing uploaded'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: gaming-data-${{ github.event_name }}-${{ github.event.schedule || github.event.inputs.kinds }}-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

env:
  SHARED_DRIVE_ID: ${{ vars.GAMING_DRIVE_ID || '0APJqW8wSgUmkUk9PVA' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.p.outputs.full }}
      groups: ${{ steps.p.outputs.groups }}
      any: ${{ steps.p.outputs.any }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          KINDS: ${{ github.event.inputs.kinds }}
          LIVE: ${{ vars.GAMING_LIVE }}
        run: |
          python3 - <<'EOF'
          import json, os, time
          ev, sched, kinds = os.environ['EVENT'], os.environ.get('SCHEDULE', ''), os.environ.get('KINDS') or 'full'
          full, groups = False, []
          DEV = [['code'], ['inputs'], ['videos', 'assets'], ['gdd', 'telemetry'], ['lgi_dev']]
          if ev == 'schedule':
              if os.environ.get('LIVE') != 'true':
                  pass
              elif sched.startswith('20 4'):
                  full = True
              else:
                  groups = [['players']]
                  if time.gmtime().tm_hour == 2:
                      groups = [['players', 'players_daily'], ['prices'], ['mobile']]
          elif kinds.strip() == 'full':
              full = True
          elif kinds.strip() == 'dev':
              groups = DEV
          else:
              groups = [[k.strip()] for k in kinds.split(',') if k.strip()]
          if full:
              groups = [['details'], ['reviews'], ['news'], ['hardware'], ['companies']] + DEV
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"full={'true' if full else 'false'}\ngroups={json.dumps([' '.join(g) for g in groups])}\n"
                      f"any={'true' if groups else 'false'}\n")
          print(full, groups)
          EOF

  catalog:
    needs: pick
    if: needs.pick.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Steam catalogue
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
        run: python -m gaming.main catalog

  collect:
    needs: [pick, catalog]
    if: always() && needs.pick.outputs.any == 'true' && needs.catalog.result != 'failure' && needs.catalog.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.pick.outputs.groups) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Collect ${{ matrix.group }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: '330'
        run: python -m gaming.main ${{ matrix.group }}
      - name: Keep dry-run samples
        if: always() && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gaming-samples-${{ strategy.job-index }}-${{ github.run_id }}
          path: excel/samples
          retention-days: 7
          if-no-files-found: ignore

  benchmarks:
    needs: [pick, collect]
    if: always() && needs.pick.outputs.full == 'true' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Industry benchmarks
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
        run: python -m gaming.main benchmarks
