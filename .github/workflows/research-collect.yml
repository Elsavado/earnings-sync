name: Research notebooks and Figma designs

# Collects research notebooks from STEM papers and theses, and Figma designs with the HTML/CSS built from them
# (openly licensed sources only), anonymises them and uploads them to the Google Workspace Shared Drive
# "IR Transcripts" as "<Type>/Folder N (Documents a-b)/<n> - <label>.<ext>" (fdocs/research.py).
# One job per type runs in parallel; each keeps its own state file in "Research Collector - private".
# Runs chain back-to-back while the repository variable RESEARCH_LIVE is 'true'.
# Sign-in: joseph@irtranscripts.com's Google refresh token (WS_GOOGLE_* secrets).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Process without uploading'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'Run budget in minutes'
        required: false
        default: '50'
      kinds:
        description: 'Only these types (comma list: scinotebooks,figma,styleguides)'
        required: false
        default: 'scinotebooks,figma'
      chained:
        description: 'Started by the previous run (internal)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: research-collect-${{ github.event.inputs.dry_run || 'false' }}
  cancel-in-progress: false

env:
  SHARED_DRIVE_ID: ${{ vars.RESEARCH_DRIVE_ID || '0AM6PzKRbJBK-Uk9PVA' }}
  FD_ROOT: ''
  FD_PRIVATE: 'Research Collector - private'
  FD_APP: 'irt-research'
  COLLECTOR_TITLE: 'Research notebooks and Figma designs'

jobs:
  prepare:
    # A chained run re-checks RESEARCH_LIVE when it starts, so pausing always stops the chain.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      go: ${{ steps.check.outputs.go }}
      kinds: ${{ steps.check.outputs.kinds }}
    steps:
      - id: check
        env:
          LIVE: ${{ vars.RESEARCH_LIVE }}
          CHAINED: ${{ github.event.inputs.chained || 'false' }}
          KINDS: ${{ github.event.inputs.kinds || 'scinotebooks,figma' }}
        run: |
          python3 - <<'EOF'
          import json, os
          go = not (os.environ['CHAINED'] == 'true' and os.environ['LIVE'] != 'true')
          kinds = [k.strip() for k in os.environ['KINDS'].split(',') if k.strip() in ('scinotebooks', 'figma', 'styleguides')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"go={'true' if go and kinds else 'false'}\nkinds={json.dumps(kinds)}\n")
          print('go' if go else 'stop', kinds)
          EOF

  collect:
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 58
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.prepare.outputs.kinds) }}
    defaults:
      run:
        working-directory: excel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: excel/requirements.txt
      - name: Install Python packages
        run: pip install -q -r requirements.txt
      - name: Collect, anonymise and upload
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.WS_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.WS_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.WS_GOOGLE_REFRESH_TOKEN }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
          # Web search (fdocs/websearch.py): Google Programmable Search when both are set, else Brave, else none.
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
          KINDS: ${{ matrix.kind }}
          WORKERS: '3'
        run: python -m fdocs.main
      - name: Keep dry-run samples
        if: always() && github.event.inputs.dry_run == 'true' && hashFiles('excel/samples/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: research-samples-${{ matrix.kind }}-${{ github.run_id }}
          path: excel/samples
          retention-days: 7

  next:
    # Runs chain back-to-back. Dry runs and a paused collector stop the chain.
    needs: [prepare, collect]
    if: always() && needs.prepare.outputs.go == 'true' && github.event.inputs.dry_run != 'true' && vars.RESEARCH_LIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-collect.yml -R ${{ github.repository }} --ref main -f dry_run=false -f minutes=50 -f chained=true
